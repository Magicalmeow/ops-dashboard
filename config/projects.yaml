# Ops Dashboard Project Configuration
# Sections: WEATHER (performance), CRYPTO (performance), PROJECTS (git status)

telegram:
  bot_token: ""  # Set via environment: OPS_DASHBOARD_BOT_TOKEN
  chat_id: ""    # Set via environment: OPS_DASHBOARD_CHAT_ID

notion:
  page_id: ""    # Set via environment: NOTION_PAGE_ID

blocker_thresholds:
  no_trades_hours: 48
  stale_pnl_days: 3
  no_commits_days: 5

projects:
  # --- Section 1: Weather Performance ---
  - name: "Weather Bot"
    priority: 1
    collector_type: "trading_weather"
    base_path: "/root/polymarket-kalshi-weather-bot"
    paths:
      signal_log: "signal_log.tsv"
      paper_trades: "paper_trades.tsv"
      portfolio_state_dir: "data_cache/weather_paper"
    fallback_base: "/opt/wx-bot"

  # --- Section 2: Crypto Performance ---
  - name: "Crypto Prediction"
    priority: 2
    collector_type: "trading_crypto"
    base_path: "/opt/crypto-prediction"

  # --- Section 3: Project Status ---
  - name: "Equity Engine"
    priority: 3
    collector_type: "git"
    base_path: "/root/conviction-equity-engine"
    github_repo: "Magicalmeow/conviction-equity-engine"

  - name: "Polymarket Intel"
    priority: 4
    collector_type: "git"
    base_path: "/root/polymarket-intel"
    github_repo: "Magicalmeow/polymarket-intel"

  - name: "Crypto 15min Bot"
    priority: 5
    collector_type: "git"
    base_path: "/root/crypto-15min-bot"
    github_repo: "Magicalmeow/crypto-15min-bot"
